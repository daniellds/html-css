<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <h1>Color, range and file</h1>
    <form action="cadastro.php" method="get">
        <p>
            <label for="icor">Cor:</label>
            <input type="color" name="cor" id="icor" value="#ffffff">
        </p>

        <p>
            <label for="inivel">Nível:</label>
            <input type="range" name="nivel" id="inivel" min="0" max="5" value="2">
        </p>

        <p>
            <label for="ifoto">Imagem:</label>
            <input type="file" name="foto" id="ifoto">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar ">
        </p>
    </form>
</head>
<body>
    
</body>
</html>
