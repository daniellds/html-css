<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Teste de formulários</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" required autocomplete="name" maxlength="30" placeholder="Nome">
        </p>

        <p>
            <label for="imedia">Média:</label>
            <input type="number" name="media" id="imedia" required autocomplete="current-password" max="20" min="0" placeholder="0 à 20" step="0.1">
        </p>

        <p>
            <label for="imes">Período lectivo</label>
            <input type="month" name="mes" id="imes">
        </p>

        <p>
            <label for="ihora">Horário da prova:</label>
            <input type="time" name="" id="">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>


    </form>
</body>
</html>
